(function (root) {

  const VERSION = 1;

  const GENRES = freeze({

    pop: { id: 'pop', label: '综合流行', desc: '声乐 34% · 舞蹈 33% · 舞台 33%', weights: { vocal: .34, dance: .33, stage: .33 }, color: '#21836c' }

  });
  const POLICIES = freeze({

    media: { id: 'media', label: '传播先行', desc: '懂得经营注意力，也要留住它。', pro: '宣传热度和新增粉丝 +25%', con: '每周房租增加 1500 元' }
  });
  const FACILITIES = freeze({
    training: { id: 'training', label: '练习室', desc: '镜面、音响与专业训练支持', costs: [24000, 60000, 120000], upkeep: 300, effect: '每级训练成长 +20%，合练准备 +2' },
    recording: { id: 'recording', label: '录音室', desc: '更快的制作流程与更好的录音', costs: [30000, 70000, 140000], upkeep: 350, effect: '每级每周制作 +6%，质量 +2' },

  const VENUES = freeze({

  const MILESTONES = freeze([
    { id: 'debut', title: '第一次被听见', desc: '发行第一首作品', reward: 10000 },
    { id: 'fans', title: '万人应援', desc: '粉丝达到 10000', reward: 30000 },
    { id: 'catalog', title: '作品说话', desc: '累计发行 3 首作品', reward: 20000 },
    { id: 'quality', title: '口碑之作', desc: '一首作品质量达到 80', reward: 40000 },
    { id: 'numberone', title: '榜首时刻', desc: '一首作品登上榜单第 1 名', reward: 50000 },
    { id: 'fandom', title: '五万人的名字', desc: '粉丝达到 50000', reward: 50000 }

  const ROLE_LABELS = freeze(['主唱', '主舞', '中心位', '说唱', '队长']);
  const TRAITS = freeze([
    { id: 'ear', label: '天生好耳朵', desc: '声乐成长额外 +15%' },
    { id: 'rhythm', label: '节奏直觉', desc: '舞蹈成长额外 +15%' },
    { id: 'camera', label: '镜头宠儿', desc: '舞台成长额外 +15%' },
    { id: 'steady', label: '稳定发挥', desc: '训练少消耗 2 点体力' },
    { id: 'team', label: '团队黏合剂', desc: '参与合练时默契额外 +2' }
  ]);
  const grade = q => q >= 85 ? 'S' : q >= 70 ? 'A' : q >= 55 ? 'B' : 'C';
  const initialMembers = () => [
    { id: 'm1', name: '宋知夏', age: 21, role: '主唱', skills: { vocal: 68, dance: 42, stage: 57 }, energy: 86, morale: 82, potential: 94, salary: 2600, trait: clone(TRAITS[0]), active: true, fee: 0 },
    { id: 'm2', name: '林予安', age: 20, role: '主舞', skills: { vocal: 43, dance: 70, stage: 58 }, energy: 88, morale: 80, potential: 92, salary: 2700, trait: clone(TRAITS[1]), active: true, fee: 0 },
    { id: 'm3', name: '许澄', age: 22, role: '中心位', skills: { vocal: 54, dance: 53, stage: 67 }, energy: 84, morale: 84, potential: 93, salary: 2500, trait: clone(TRAITS[4]), active: true, fee: 0 }
  ];
  function finite(n, lo, hi, label, integer = false) { check(typeof n === 'number' && Number.isFinite(n) && n >= lo && n <= hi && (!integer || Number.isInteger(n)), '存档数值无效：' + label); }
  function validString(s, max, label) { check(typeof s === 'string' && s.length > 0 && s.length <= max && !/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(s), '存档文本无效：' + label); }
  function validateState(s) {
    check(s && typeof s === 'object' && s.version === VERSION, '存档版本不兼容');
    validString(s.companyName, 32, '公司名'); validString(s.groupName, 32, '团体名');
    check(own(POLICIES, s.policy) && ['normal', 'easy'].includes(s.difficulty), '公司定位或难度无效');
    check(['playing', 'review', 'lost'].includes(s.status), '经营状态无效');
    finite(s.week, 1, 5201, '周数', true); finite(s.year, 1, 100, '年份', true);
    finite(s.cash, -1e9, 1e9, '现金'); finite(s.fans, 0, 1e8, '粉丝');
    for (const k of ['hype', 'reputation', 'cohesion']) finite(s[k], 0, 100, k);
    for (const k of ['totalIncome', 'totalExpenses']) finite(s[k], 0, 1e12, k);
    finite(s.debt, 0, 100000, '贷款'); finite(s.rng, 0, 4294967295, '随机种子', true); finite(s.nextId, 1, 1e8, '编号', true);
    finite(s.deficitWeeks, 0, 10000, '赤字周数', true);
    for (const k of ['scoutedWeek', 'lastReleaseWeek', 'lastGigWeek']) finite(s[k], 0, s.week, k, true);

    const ids = new Set();
    for (const m of [...s.roster, ...s.candidates]) {
      check(m && typeof m === 'object', '成员数据缺失'); validString(m.id, 40, '成员编号');

      for (const k of ['vocal', 'dance', 'stage']) finite(m.skills[k], 0, m.potential, '能力 ' + k);
      finite(m.energy, 0, 100, '体力'); finite(m.morale, 0, 100, '士气'); finite(m.salary, 0, 1e6, '薪资'); finite(m.fee, 0, 1e7, '签约费');
      check(typeof m.active === 'boolean' && ROLE_LABELS.includes(m.role), '成员阵容或岗位无效');
      check(m.trait && TRAITS.some(t => t.id === m.trait.id), '成员特长无效'); validString(m.trait.label, 32, '特长名'); validString(m.trait.desc, 120, '特长说明');
    }
    const active = s.roster.filter(m => m.active); check(active.length >= 3 && active.length <= 5, '出场阵容必须为 3–5 人');
    check(s.plans && typeof s.plans === 'object' && !Array.isArray(s.plans), '个人排程缺失');
    check(Object.keys(s.plans).length === s.roster.length, '个人排程数量不符');
    for (const [id, plan] of Object.entries(s.plans)) check(s.roster.some(m => m.id === id) && own(PLANS, plan), '个人排程引用无效');
    check(own(ACTIONS, s.companyAction) && own(VENUES, s.venue), '团体行动无效');
    check(s.facilities && Object.keys(s.facilities).length === 4, '设施数据缺失');
    for (const k of Object.keys(FACILITIES)) finite(s.facilities[k], 0, 3, '设施 ' + k, true);
    finite(s.marketOffset, 0, 2, '市场风向', true);
    check(s.project === null || (typeof s.project === 'object' && !Array.isArray(s.project)), '项目无效');
    if (s.project) {
      validString(s.project.id, 40, '项目编号'); validString(s.project.title, 32, '歌名');
      check(own(GENRES, s.project.genre) && own(BUDGETS, s.project.budget), '项目配置无效');

    dialog(lost ? '暂时收起招牌，下一次再出发。' : '第 ' + s.year + ' 年 · 你的厂牌成绩单', '<div class="year-hero"><span class="eyebrow">' + (s.cheated ? 'SANDBOX RECORD' : 'YEAR IN REVIEW') + '</span><h3>' + esc(y.title || (lost ? '经营暂停' : completed === 3 ? '声音被听见了。' : completed > 0 ? '已经走出第一步。' : '作品与成长，都还在路上。')) + '</h3><p>' + esc(y.summary || y.message || (lost ? '现金不足无法继续支付经营支出。新的公司，值得一份更稳妥的预算。' : '一年里的每次训练、每张唱片、每笔账目，都组成了这份记录。')) + '</p></div><div class="goal-grid year-goals">' + goalCards(s, v) + '</div><div class="report-kpis"><div><span>累计经营收入</span><strong>' + money(s.totalIncome) + '</strong></div><div><span>当前现金</span><strong>' + money(s.cash) + '</strong></div><div><span>行业口碑</span><strong>' + fmt(s.reputation) + '</strong></div></div><p class="small muted">' + (s.cheated ? '本存档使用过沙盒辅助，成绩保留沙盒标记。' : '这份成绩来自正常经营。') + '</p><div class="dialog-actions">' + button('导出这份存档', 'export', '', 'btn') + (lost ? button('成立新公司', 'new-game', '', 'btn primary') : button('进入下一年 ' + icon('arrow'), 'continue-year', '', 'btn primary')) + '</div>', { wide: true });
  }
  function showRelease() {
    var s = game.state, v = game.view(), e = v.projectEstimate;
    if (!s.project || !v.canRelease) { toast('制作进度达到 100% 后才能发行。', true); return; }
    dialog('发行《' + s.project.title + '》', '<p class="dialog-lead">作品已经准备好。宣传费将在确认时支付，随后立即结算发行收入和新增粉丝。</p><div class="release-preview">' + cover(s.project, true) + '<div><span class="eyebrow">预计品质</span><strong>' + fmt(e.quality) + '<small>/ 100</small></strong><span class="grade grade-' + esc(e.grade) + '">' + esc(e.grade) + '</span><p>预计基础新增粉丝 ' + compact(e.estimatedFans) + '<br>预计发行收入 ' + money(e.estimatedRevenue) + '</p></div></div>' + qualityComponents(e) + '<form id="release-form"><fieldset><legend>发行宣传</legend><div class="marketing-options">' + [[0, '自然发布', '让作品自己说话'], [10000, '定向宣传', '为新听众打开一扇门'], [30000, '集中推广', '在这一周放大声量']].map(function (a) { return '<label class="choice-card"><input type="radio" name="marketing" value="' + a[0] + '" ' + (a[0] === 0 ? 'checked' : '') + ' ' + (a[0] > 0 && s.cash < a[0] ? 'disabled' : '') + '><span><b>' + a[1] + '</b><strong>' + money(a[0]) + '</strong><small>' + a[2] + '</small></span><i class="choice-dot"></i></label>'; }).join('') + '</div></fieldset><p class="small muted">最终销量还会受到市场风向、热度、口碑与团体表现影响。</p><div class="dialog-actions">' + button('再准备一下', 'close-dialog', '', 'btn') + '<button class="btn primary" type="submit">确认发行 ' + icon('arrow') + '</button></div></form>', { wide: true });
  }
  function showSaves() {
    dialog('存档与备份', '<div class="save-cards"><article><span class="save-card-icon">↓</span><h3>导出当前公司</h3><p>下载 JSON 文件，保存完整经营状态。更换浏览器或移动游戏文件前，建议先导出。</p>' + button(icon('download') + '导出 JSON', 'export', '', 'btn primary') + '</article><article><span class="save-card-icon">↑</span><h3>导入经营存档</h3><p>仅接受本游戏导出的有效 JSON。先检查文件，再由你确认替换当前公司。</p>' + button('选择 JSON 文件', 'import', '', 'btn') + '</article></div>' + (storageLocked ? '<div class="recovery-box"><h3>旧存档未被覆盖</h3><p>检测到无法读取的旧存档。你可以先下载原始内容，或确认用当前公司替换。替换前不会自动写入本机。</p><div class="button-row">' + button('下载旧文件', 'export-corrupt', '', 'btn') + button('替换旧存档', 'replace-corrupt-dialog', '', 'btn') + '</div></div>' : '') + '<div class="save-explainer"><b>' + (storageIssue ? '自动保存需要注意' : '自动保存已启用') + '</b><p>每次成功操作后保存在本浏览器。清理网站数据、隐私模式或改变 HTML 文件位置，可能导致本机存档不可见；JSON 备份不受这些影响。游戏不会连接云端。</p></div><div class="dialog-actions">' + button('返回', 'close-dialog', '', 'btn primary') + '</div>', { wide: true });
  }
  function showHelp() {
    dialog('事务所开工指南', '<div class="help-intro"><span>01 → 52</span><p>每次点击「结算这一周」，才会推进时间。<br>先排计划，再统一结账。</p></div><div class="help-grid"><section><h3>01 / 每周先做什么</h3><p>为所有成员选择训练或休息，再安排一项团体行动。选择计划本身不扣钱，也不会推进时间。</p></section><section><h3>02 / 第一张作品</h3><p>在音乐制作中选择风格和预算，立项立即支付制作费。安排「录音制作」推进进度至 100%，准备度和成员能力影响品质。</p></section><section><h3>03 / 发行与回款</h3><p>发行时可追加宣传费，立即结算唱片收入与粉丝。之后作品版税和周边收入会随每周经营持续入账。</p></section><section><h3>04 / 两种付款时间</h3><p><b>即时：</b>制作预算、发行宣传、签约、试镜、设施升级。<br><b>周末：</b>工资、租金、维护、训练、团体行动与借款利息。</p></section><section><h3>05 / 别透支成员</h3><p>体力和心情会影响表现。低体力时可选个人休息或团体休整。上场至少 3 人，最多 5 人；签约成员最多 6 人。</p></section><section><h3>06 / 一年后</h3><p>经营 52 周会生成年度成绩，检查粉丝、发行数量与最佳作品品质。完成结算后可以继续下一年。使用修改器会永久标记沙盒存档。</p></section></div><div class="keyboard-help"><kbd>Alt</kbd> + <kbd>M</kbd> 打开沙盒修改器 <span>·</span> <kbd>Esc</kbd> 关闭弹窗 <span>·</span> 标签可用方向键切换</div><div class="dialog-actions">' + button('开始经营 ' + icon('arrow'), 'close-dialog', '', 'btn primary') + '</div>', { wide: true });
  }
  function showSandbox() {
    var s = game.state;
    if (!s.sandbox) {
      confirmDialog('开启沙盒辅助？', '开启后可调整资源、恢复成员、快速完成作品，并撤销上一次辅助修改。该存档会永久保留「沙盒」标记，撤销也不会移除标记。建议先导出正常经营备份。', 'enable-sandbox', '', '确认开启沙盒');
      return;
    }
    dialog('沙盒修改器', '<div class="banner warning"><span>本存档已标记为沙盒。每次辅助修改前会保留一个撤销检查点。</span></div><div class="cheat-quick"><h3>快捷辅助</h3><div class="button-row">' + button('资金 +¥100,000', 'cheat', 'data-kind="cash"', 'btn') + button('粉丝 +10,000', 'cheat', 'data-kind="fans"', 'btn') + button('全员体力与心情恢复', 'cheat', 'data-kind="restore"', 'btn') + button('全员能力提升至 85', 'cheat', 'data-kind="skills"', 'btn') + button('当前作品制作完成', 'cheat', 'data-kind="project" ' + (!s.project ? 'disabled' : ''), 'btn') + '</div><p class="small muted">能力提升仍受成员潜力上限限制。</p></div><form id="cheat-set-form"><h3>精确设置公司数值</h3><div class="two-fields"><label>现金<input name="cash" type="number" min="0" max="999999999" step="1" value="' + Math.round(s.cash) + '" required></label><label>粉丝<input name="fans" type="number" min="0" max="999999999" step="1" value="' + Math.round(s.fans) + '" required></label><label>市场热度<input name="hype" type="number" min="0" max="100" step="1" value="' + Math.round(s.hype) + '" required></label><label>行业口碑<input name="reputation" type="number" min="0" max="100" step="1" value="' + Math.round(s.reputation) + '" required></label></div><button type="submit" class="btn ink">应用这些数值</button></form><form id="cheat-mods-form" class="cheat-mods"><h3>持续辅助</h3><label class="switch-line"><span><b>无限体力</b><small>成员不再因工作消耗体力</small></span><input type="checkbox" name="infiniteEnergy" ' + (s.mods.infiniteEnergy ? 'checked' : '') + '></label><label class="switch-line"><span><b>免除固定经营支出</b><small>由引擎按沙盒规则免除维护类开支</small></span><input type="checkbox" name="freeUpkeep" ' + (s.mods.freeUpkeep ? 'checked' : '') + '></label><button class="btn" type="submit">保存持续辅助设置</button></form><div class="undo-box"><div><h3>撤销上一次辅助修改</h3><p>恢复修改前的整局状态，之后的经营进度也会回退。</p></div>' + button('撤销上次辅助', 'undo-cheat', '', 'btn') + '</div><div class="dialog-actions">' + button('完成', 'close-dialog', '', 'btn primary') + '</div>', { wide: true });
  }
  function showSettings() {
    var s = game.state;
    dialog('公司与团体名称', '<form id="company-form"><div class="two-fields"><label>公司名称<input name="companyName" maxlength="20" value="' + esc(s.companyName) + '" required></label><label>团体名称<input name="groupName" maxlength="18" value="' + esc(s.groupName) + '" required></label></div><p class="small muted">经营方向为「' + esc(defLabel(Core.POLICIES, s.policy)) + '」，本局内保持不变。</p><div class="dialog-actions">' + button('取消', 'close-dialog', '', 'btn') + '<button class="btn primary" type="submit">保存名称</button></div></form>');
  }
  function download(text, filename) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
  var importInput = document.createElement('input');
  importInput.type = 'file'; importInput.accept = '.json,application/json'; importInput.hidden = true; importInput.setAttribute('aria-label', '选择经营存档'); document.body.appendChild(importInput);
  importInput.addEventListener('change', function () {
    var file = importInput.files && importInput.files[0]; importInput.value = '';
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { toast('存档文件过大，请选择本游戏导出的 JSON。', true); return; }
    file.text().then(function (text) {
      try {
        pendingImport = Core.Game.fromSave(text);
        var s = pendingImport.state;
        confirmDialog('确认导入这家事务所？', '即将导入「' + s.companyName + ' / ' + s.groupName + '」，第 ' + s.year + ' 年第 ' + localWeek(s) + ' 周，资金 ' + money(s.cash) + '。确认后会替换当前本机存档。', 'confirm-import', '', '确认替换并导入');
      } catch (e) { pendingImport = null; toast('无法导入：' + (e.message || '文件格式不正确。'), true); }
    }).catch(function () { toast('文件读取失败，请重新选择。', true); });
  });

  function changeTab(next, focus) {
    if (!TABS.some(function (t) { return t[0] === next; })) return;
    tab = next; render();
    if (focus) document.getElementById('tab-' + next).focus();
    else { var main = document.getElementById('main-content'); main.focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: 'instant' }); }
  }
  function findMember(id) { return game.state.roster.find(function (m) { return String(m.id) === String(id); }); }
  document.addEventListener('click', function (event) {
    var tabButton = event.target.closest('[data-tab]');
    if (tabButton) { changeTab(tabButton.dataset.tab, true); return; }
    var b = event.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var a = b.dataset.act, id = b.dataset.id, s = game.state, result;
    if (a === 'home') event.preventDefault();
    if (a === 'close-dialog') return closeDialog();
    if (a === 'home') return changeTab('overview');
    if (a.indexOf('go-') === 0) return changeTab(a.slice(3));
    if (a === 'end-week') return dispatch('endWeek');
    if (a === 'help') return showHelp();
    if (a === 'saves') return showSaves();
    if (a === 'new-game') return showNewGame(false);
    if (a === 'company-settings') return showSettings();
    if (a === 'sandbox') return showSandbox();
    if (a === 'year-review') return showYearReview();
    if (a === 'last-report') return showReport(s.lastReport);
    if (a === 'history-report') return showReport(s.history[Number(b.dataset.index)]);
    if (a === 'release-dialog') return showRelease();
    if (a === 'choose-action') return dispatch('planCompany', { action: b.dataset.action, venue: s.venue });
    if (a === 'choose-venue') return dispatch('planCompany', { action: 'gig', venue: b.dataset.venue });
    if (a === 'toggle-active') return dispatch('setActive', { id: id, active: b.dataset.active === 'true' });
    if (a === 'scout') return dispatch('scout');
    if (a === 'hire') return dispatch('hire', { id: id });
    if (a === 'upgrade') return dispatch('upgrade', { facility: b.dataset.facility });
    if (a === 'loan') return confirmDialog('借入经营周转金？', '借入 ¥100,000，之后每周支付 ¥400 利息。借款本金不计入经营收入，可在资金充足时一次还清。', 'confirm-loan', '', '确认借入');
    if (a === 'confirm-loan') { result = dispatch('loan'); if (result) closeDialog(); return; }
    if (a === 'repay-loan') return dispatch('repayLoan');
    if (a === 'rename-member') { var m = findMember(id); if (!m) return; return dialog('修改成员姓名', '<form id="member-name-form" data-id="' + esc(id) + '"><label>成员姓名<input name="name" value="' + esc(m.name) + '" maxlength="12" required></label><div class="dialog-actions">' + button('取消', 'close-dialog', '', 'btn') + '<button class="btn primary" type="submit">保存姓名</button></div></form>'); }
    if (a === 'dismiss-dialog') { var m2 = findMember(id); if (!m2) return; return confirmDialog('与 ' + m2.name + ' 解约？', '解约将支付一周工资 ' + money(m2.salary) + ' 作为补偿。解约后至少保留 3 位成员，且上场阵容至少 3 人。', 'confirm-dismiss', 'data-id="' + esc(id) + '"', '确认解约'); }
    if (a === 'confirm-dismiss') { result = dispatch('dismiss', { id: id }); if (result) closeDialog(); return; }
    if (a === 'export') { download(game.serialize(), '出道事务所-第' + s.year + '年第' + localWeek(s) + '周.json'); toast('经营存档已导出。'); return; }
    if (a === 'import') return importInput.click();
    if (a === 'confirm-import' && pendingImport) { game = pendingImport; pendingImport = null; storageLocked = false; corruptSave = ''; save(); tab = 'overview'; render(); closeDialog(); toast('存档已导入，欢迎回来。'); return; }
    if (a === 'export-corrupt') { download(corruptSave, '出道事务所-原始损坏存档.json'); return; }
    if (a === 'replace-corrupt-dialog') return confirmDialog('替换无法读取的旧存档？', '确认后会用当前试玩的公司覆盖旧存档，并重新启用自动保存。旧存档将无法再从本机恢复，建议先下载原始文件。', 'replace-corrupt', '', '确认替换');
    if (a === 'replace-corrupt') { storageLocked = false; corruptSave = ''; save(); render(); closeDialog(); toast('已保存当前公司，自动保存已恢复。'); return; }
    if (a === 'enable-sandbox') { result = dispatch('enableSandbox'); if (result) showSandbox(); return; }
    if (a === 'cheat') { result = dispatch('cheat', { kind: b.dataset.kind }); if (result) showSandbox(); return; }
    if (a === 'undo-cheat') { try { result = game.undoCheat(); if (!result.ok) { toast(result.message, true); return; } save(); render(); showSandbox(); toast(result.message || '已恢复辅助修改前的状态。'); } catch (e) { toast(e.message, true); } return; }
    if (a === 'continue-year') { result = dispatch('continue'); if (result) { closeDialog(); tab = 'overview'; render(); } }
  });
  document.addEventListener('change', function (event) {
    var node = event.target;
    if (node.dataset.ui === 'auto-report') { autoReport = node.checked; return; }
    if (node.dataset.ui === 'member-plan') dispatch('planMember', { id: node.dataset.id, plan: node.value }, { quiet: true });
    if (node.dataset.ui === 'role') dispatch('setRole', { id: node.dataset.id, role: node.value }, { quiet: true });
  });
  document.addEventListener('submit', function (event) {
    var f = event.target;
    if (!['project-form', 'release-form', 'new-game-form', 'company-form', 'member-name-form', 'cheat-set-form', 'cheat-mods-form'].includes(f.id)) return;
    event.preventDefault();
    var data = new FormData(f), result;
    if (f.id === 'project-form') return dispatch('startProject', { title: String(data.get('title') || '').trim(), genre: data.get('genre'), budget: data.get('budget') });
    if (f.id === 'release-form') {
      result = dispatch('release', { marketing: Number(data.get('marketing')) });
      if (result) {
        var t = result.release;
        if (!t) { closeDialog(); return; }
        dialog('新作品，正式上线。', '<div class="release-success">' + cover(t) + '<div><span class="eyebrow">OUT NOW / W' + t.week + '</span><h3>' + esc(t.title) + '</h3><div class="record-score"><span class="grade grade-' + esc(t.grade) + '">' + esc(t.grade) + '</span><b>' + fmt(t.quality) + ' 品质</b></div><p>新增粉丝 <strong>+' + compact(t.fansGain) + '</strong><br>发行收入 <strong>' + money(t.revenue) + '</strong></p></div></div>' + qualityComponents(t) + '<div class="dialog-actions">' + button('继续经营 ' + icon('arrow'), 'close-dialog', '', 'btn primary') + '</div>', { wide: true });
      }
      return;
    }
    if (f.id === 'new-game-form') {
      try { game = new Core.Game({ companyName: String(data.get('companyName')).trim(), groupName: String(data.get('groupName')).trim(), policy: data.get('policy'), difficulty: data.get('difficulty'), seed: String(data.get('seed') || '').trim() || undefined }); storageLocked = false; corruptSave = ''; save(); tab = 'overview'; render(); closeDialog(); toast('公司正式开工。先安排训练，再结算第一周。'); } catch (e) { toast(e.message || '无法创建公司，请检查输入。', true); }
      return;
    }
    if (f.id === 'company-form') { result = dispatch('renameCompany', { companyName: String(data.get('companyName')).trim(), groupName: String(data.get('groupName')).trim() }); if (result) closeDialog(); return; }
    if (f.id === 'member-name-form') { result = dispatch('renameMember', { id: f.dataset.id, name: String(data.get('name')).trim() }); if (result) closeDialog(); return; }
    if (f.id === 'cheat-set-form') { result = dispatch('cheat', { kind: 'set', cash: Number(data.get('cash')), fans: Number(data.get('fans')), hype: Number(data.get('hype')), reputation: Number(data.get('reputation')) }); if (result) showSandbox(); return; }
    if (f.id === 'cheat-mods-form') { result = dispatch('cheat', { kind: 'mods', infiniteEnergy: data.has('infiniteEnergy'), freeUpkeep: data.has('freeUpkeep') }); if (result) showSandbox(); }
  });
  document.addEventListener('keydown', function (event) {
    if (event.altKey && event.key.toLowerCase() === 'm') { event.preventDefault(); if (currentDialog && currentDialog.querySelector('#cheat-set-form')) closeDialog(); else showSandbox(); return; }
    var target = event.target.closest('[data-tab]');
    if (target && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      var i = TABS.findIndex(function (t) { return t[0] === target.dataset.tab; });
      var next = event.key === 'Home' ? 0 : event.key === 'End' ? TABS.length - 1 : (i + (event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 1) + TABS.length) % TABS.length;
      changeTab(TABS[next][0], true);
    }
  });
  render();
  if (!storageLocked && firstVisit) save();
  if (storageLocked) { showSaves(); toast('旧存档无法读取，已保留原始内容并暂停自动写入。', true); }
  else if (firstVisit) showNewGame(true);
})();

</script>
</body>
</html>
